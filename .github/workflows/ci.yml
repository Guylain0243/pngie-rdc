name: PNGIE-RDC — Tests automatiques

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pngie
          POSTGRES_PASSWORD: pngie_ci_pw
          POSTGRES_DB: pngie_rdc
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports: ['6379:6379']
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Installer les dépendances
        run: npm ci

      - name: Vérification syntaxique de tous les fichiers JS
        run: |
          for f in $(find db src scripts -name '*.js'); do
            node --check "$f"
          done

      - name: "Suite de tests automatisés sur SQLite (32 tests : auth, RBAC, no-code, gouvernance)"
        run: npm test

      - name: Charger le schéma dans PostgreSQL (service CI réel)
        run: PGPASSWORD=pngie_ci_pw psql -h localhost -U pngie -d pngie_rdc -f db/schema.sql
        env:
          PGPASSWORD: pngie_ci_pw

      - name: Peupler et vérifier PostgreSQL (le vrai moteur de production)
        run: node db/seed.js
        env:
          DATABASE_URL: postgresql://pngie:pngie_ci_pw@localhost:5432/pngie_rdc

      - name: Test de charge (échoue le build si des erreurs apparaissent sous charge)
        run: npm run loadtest
